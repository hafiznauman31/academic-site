bio: |
  Hafiz Nauman Baig is a PhD Research Scholar in the Department of Zoology at Quaid-i-Azam University, Islamabad. His research focuses on fish environmental and thermal stress physiology, sustainable intensive aquaculture, oxidative stress biomarkers, and innovative dietary prophylactic strategies in recirculating aquaculture systems (RAS).

